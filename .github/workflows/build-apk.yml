name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Your gradle.properties points at a Windows Android Studio path; that breaks on Linux.
      - name: Remove local JDK path
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon

      - name: Check there is no INTERNET permission
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          $AAPT dump permissions app/build/outputs/apk/release/app-release.apk | tee perms.txt
          ! grep -q "android.permission.INTERNET" perms.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AttentionTwin-apk
          path: app/build/outputs/apk/release/app-release.apk
